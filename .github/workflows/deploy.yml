name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.140.166.97
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_ENV
          command_timeout: 30m
          script: |
            export DEPLOY_DIR=/app/InvoiceReader
            export REPO=https://github.com/leopbar/InvoiceReader.git

            # Clone or reset to latest main
            if [ -d "$DEPLOY_DIR/.git" ]; then
              git -C "$DEPLOY_DIR" fetch --all
              git -C "$DEPLOY_DIR" reset --hard origin/main
            else
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO" "$DEPLOY_DIR"
            fi

            cd "$DEPLOY_DIR"

            # Write env files (printf avoids shell-expanding special characters)
            printf '%s' "$VPS_ENV" > .env
            grep -v '^VITE_' .env | grep -v '^#' | grep -v '^$' > backend/.env

            # Rebuild and restart
            docker compose build --no-cache
            docker compose up -d --remove-orphans
            docker image prune -f

            echo "Deploy finished."
        env:
          VPS_ENV: ${{ secrets.VPS_ENV }}
